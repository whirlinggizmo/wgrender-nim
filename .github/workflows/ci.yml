# wgrender-nim CI.
#
# raw.nim is generated from wgrender's headers by tools/gen_raw.py (clang's AST of
# them), and --check fails if it is stale; tools/coverage.py then checks every
# declaration against the headers independently, by compiling assertions about it.
# Locally coverage skips without clang; here --require-clang makes a missing toolchain
# a failure, so nothing reaches main without the checks running.
#
# wgrender comes from the pinned submodule, so the binding is checked against the
# wgrender it pins rather than whatever wgrender's main happens to be; moving the pin
# is what brings an API change here, and this is where it fails.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "bench/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "bench/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  coverage:
    name: raw.nim is generated from wgrender's headers and matches them
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/cache@v6
        with:
          path: emsdk-cache
          key: emsdk-5.0.7-${{ runner.os }}

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 5.0.7
          actions-cache-folder: emsdk-cache

      - name: raw.nim is what tools/gen_raw.py makes of the headers
        run: python3 tools/gen_raw.py --check

      - name: Every declaration against the headers, with clang
        run: python3 tools/coverage.py --check --require-clang

  build:
    name: examples build, calls compile as tests/tcalls.nim says
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: The system headers and libraries wgrender needs (GL, X11, ALSA)
        run: |
          sudo apt-get update
          python3 project/lib/wgrender-c/tools/deps.py install

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.12"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Every example, desktop (wgrender compiled in, from its build.json)
        run: |
          for example in examples/*/; do
            (cd "$example" && nim build desktop)
          done

      - name: How calls are written, and what doesn't compile
        run: cd tests && nim c -r tcalls.nim

      - name: Events through a running wgrender, headless (no window or GPU)
        run: cd tests && WGR_HEADLESS_FRAMES=2 nim c -d:wgrHeadless -r tevents.nim
